<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desain 3D Bank Sampah Botol Plastik - Desa Sadasari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #e3e9e2;
    --panel: #f3f6f1;
    --ink: #1c2a1f;
    --muted: #55655a;
    --line: #b9c6b9;
    --green: #37981b;
    --green-ink: #ffffff;
    --dim: #d9480f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161c18; --panel: #1f2722; --ink: #e5ece4; --muted: #9aab9d; --line: #34423a;
      --green: #5ec932; --green-ink: #0f2208; --dim: #ff8a4c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161c18; --panel: #1f2722; --ink: #e5ece4; --muted: #9aab9d; --line: #34423a;
    --green: #5ec932; --green-ink: #0f2208; --dim: #ff8a4c;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; padding: 12px 18px 8px; }
  h1 { margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: clamp(20px, 4vw, 32px); line-height: 1.05; letter-spacing: .01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .specs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .specs li { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px 5px; min-width: 54px; text-align: center; }
  .specs b { display: block; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-size: 20px; line-height: 1.05; font-weight: 600; color: var(--ink); }
  .specs span { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  .note { position: absolute; left: 14px; right: 14px; bottom: 8px; margin: 0; font-size: 12px; color: var(--muted); pointer-events: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: space-between; padding: 8px 14px 10px; border-top: 1px solid var(--line); background: var(--panel); }
  .group { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; transition: all .15s ease; }
  button:hover { border-color: var(--green); }
  button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
  #views button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  @media (max-width: 680px) {
    header { padding: 8px 12px 6px; }
    .specs li { min-width: 44px; padding: 3px 5px; }
    .specs b { font-size: 16px; }
    .specs span { font-size: 9.5px; }
    button { font-size: 12.5px; padding: 5px 9px; }
    .bar { padding: 6px 10px 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Bank Sampah Botol Plastik<br>Desa Sadasari</h1>
      <p class="sub">Kelompok 4, KKM UMC 2026</p>
    </div>
    <ul class="specs" aria-label="Ukuran dalam cm">
      <li><b>150</b><span>Panjang cm</span></li>
      <li><b>50</b><span>Lebar cm</span></li>
      <li><b>100</b><span>Tinggi cm</span></li>
      <li><b>20×30</b><span>Lubang cm</span></li>
      <li><b>38</b><span>Press cm</span></li>
      <li><b>85</b><span>Galon cm</span></li>
    </ul>
  </header>
  <div id="stage">
    <canvas id="view" aria-label="Model 3D Bank Sampah Botol Plastik Desa Sadasari"></canvas>
    <p class="note">Seret untuk memutar 3D, scroll atau cubit untuk zoom. Tampilan disesuaikan langsung dengan instalasi lapangan Desa Sadasari.</p>
  </div>
  <div class="bar">
    <div class="group" id="views">
      <button data-v="iso" class="on">Isometrik</button>
      <button data-v="front">Depan</button>
      <button data-v="side">Samping</button>
      <button data-v="top">Atas</button>
    </div>
    <div class="group" id="toggles">
      <button data-t="dims" aria-pressed="true">Ukuran</button>
      <button data-t="roof" aria-pressed="true">Atap</button>
      <button data-t="press" aria-pressed="true">Alat Press</button>
      <button data-t="galon" aria-pressed="true">Tong Galon</button>
      <button data-t="bottles" aria-pressed="true">Botol</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // Main Bank Sampah dimensions (cm)
  const W = 150, D = 50, H = 100, LEG = 10;
  const HX = W / 2, HZ = D / 2;
  const Y0 = LEG, Y1 = 50, Y2 = 90;

  const canvas = document.getElementById('view');
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 5, 3000);
  const target = new THREE.Vector3(0, 48, 0);

  // Lighting matching outdoor daylight
  const hemi = new THREE.HemisphereLight(0xffffff, 0x687864, 0.85);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff6e6, 0.95);
  sun.position.set(130, 230, 170);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.bias = -0.0005;
  Object.assign(sun.shadow.camera, { left: -180, right: 180, top: 170, bottom: -170, near: 10, far: 750 });
  scene.add(sun);

  // Soft fill light from front-left
  const fill = new THREE.DirectionalLight(0xdbe7dc, 0.4);
  fill.position.set(-140, 100, 120);
  scene.add(fill);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.ShadowMaterial({ opacity: 0.24 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  let grid;
  function buildGrid() {
    if (grid) { scene.remove(grid); grid.geometry.dispose(); }
    const cs = getComputedStyle(document.documentElement);
    grid = new THREE.GridHelper(450, 45, new THREE.Color(cs.getPropertyValue('--muted').trim()), new THREE.Color(cs.getPropertyValue('--line').trim()));
    grid.position.y = -0.05;
    scene.add(grid);
  }
  buildGrid();
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', buildGrid);

  // ---------- Materials ----------
  // Vivid green paint matching real installation
  const green = new THREE.MeshStandardMaterial({ color: 0x3ea320, roughness: 0.42, metalness: 0.22 });
  const darkGreen = new THREE.MeshStandardMaterial({ color: 0x1f5c22, roughness: 0.35, metalness: 0.15 });
  const plate = new THREE.MeshStandardMaterial({ color: 0x5a7c50, roughness: 0.65, metalness: 0.25 });
  const footMat = new THREE.MeshStandardMaterial({ color: 0x1e241c, roughness: 0.85 });
  const wood = new THREE.MeshStandardMaterial({ color: 0x8f4d1e, roughness: 0.45, metalness: 0.05 });
  const darkWood = new THREE.MeshStandardMaterial({ color: 0x6e3812, roughness: 0.55 });
  const boltMat = new THREE.MeshStandardMaterial({ color: 0xc4c9cf, metalness: 0.85, roughness: 0.25 });
  const petMat = new THREE.MeshStandardMaterial({ color: 0xd6effd, transparent: true, opacity: 0.68, roughness: 0.15, metalness: 0.08 });
  const capMat = new THREE.MeshStandardMaterial({ color: 0x1971c2, roughness: 0.45 });

  const model = new THREE.Group();
  scene.add(model);

  function bar(x1, y1, z1, x2, y2, z2, t, mat) {
    t = t || 2.5;
    const sx = Math.max(Math.abs(x2 - x1), t), sy = Math.max(Math.abs(y2 - y1), t), sz = Math.max(Math.abs(z2 - z1), t);
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat || green);
    m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    m.castShadow = true;
    return m;
  }

  // ---------- Main Frame ----------
  const frame = new THREE.Group();
  model.add(frame);

  // Corner legs with rubber foot caps
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const lx = sx * (HX - 1.5), lz = sz * (HZ - 1.5);
    frame.add(bar(lx, 0, lz, lx, Y0, lz, 3));
    const cap = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.8, 3.6), footMat);
    cap.position.set(lx, 0.9, lz);
    frame.add(cap);
  });

  // Perimeter horizontal rectangular rails at Y0, Y1, Y2
  [Y0, Y1, Y2].forEach(y => {
    [-HZ + 1.25, HZ - 1.25].forEach(z => frame.add(bar(-HX, y, z, HX, y, z)));
    [-HX + 1.25, HX - 1.25].forEach(x => frame.add(bar(x, y, -HZ, x, y, HZ)));
  });

  // Vertical posts on front and back
  [-1, 1].forEach(sz => {
    const z = sz * (HZ - 1.25);
    // Outer corner vertical posts
    [-HX + 1.25, HX - 1.25].forEach(x => frame.add(bar(x, Y0, z, x, Y2, z)));
    // Lower center vertical divider
    frame.add(bar(0, Y0, z, 0, Y1, z));

    // Upper vertical posts framing the 20x30 cm intake hole
    // Left post at X = -15, Right post at X = +15 (lebar lubang = 30 cm)
    frame.add(bar(-15, Y1, z, -15, Y2, z));
    frame.add(bar(15, Y1, z, 15, Y2, z));

    // Horizontal sill bar at bottom of the intake hole at Y = 70 (tinggi lubang = 20 cm)
    frame.add(bar(-15, 70, z, 15, 70, z, 2.5));

    // Roof support stubs
    frame.add(bar(-HX + 1.25, Y2, z, -HX + 1.25, Y2 + (sz < 0 ? 4 : 2), z));
    frame.add(bar(HX - 1.25, Y2, z, HX - 1.25, Y2 + (sz < 0 ? 4 : 2), z));
    frame.add(bar(0, Y2, z, 0, Y2 + (sz < 0 ? 4 : 2), z));
  });

  // Lubang Masuk Botol 20 x 30 cm (frame mulut lubang di bagian depan)
  // Berukuran lebar 30 cm x tinggi 20 cm (antara X = -15 s.d. +15, Y = 70 s.d. 90)
  const holeFrame = new THREE.Group();
  holeFrame.add(bar(-15, 70, HZ + 0.3, 15, 70, HZ + 0.3, 2.2)); // bibir bawah
  holeFrame.add(bar(-15, 90, HZ + 0.3, 15, 90, HZ + 0.3, 2.2)); // bibir atas
  holeFrame.add(bar(-15, 70, HZ + 0.3, -15, 90, HZ + 0.3, 2.2)); // bibir kiri
  holeFrame.add(bar(15, 70, HZ + 0.3, 15, 90, HZ + 0.3, 2.2));  // bibir kanan
  frame.add(holeFrame);

  // Floor plate at bottom of storage cage
  const floor = new THREE.Mesh(new THREE.BoxGeometry(W - 3.5, 0.8, D - 3.5), plate);
  floor.position.set(0, Y0 + 0.4, 0);
  floor.receiveShadow = true;
  frame.add(floor);

  // Lower front double door frame with center latch
  const door = new THREE.Group();
  door.add(bar(-71, 13, HZ + 0.8, 71, 13, HZ + 0.8, 2));
  door.add(bar(-71, 47, HZ + 0.8, 71, 47, HZ + 0.8, 2));
  door.add(bar(-71, 13, HZ + 0.8, -71, 47, HZ + 0.8, 2));
  door.add(bar(71, 13, HZ + 0.8, 71, 47, HZ + 0.8, 2));
  door.add(bar(0, 13, HZ + 0.8, 0, 47, HZ + 0.8, 2));
  const latch = new THREE.Mesh(new THREE.BoxGeometry(3.5, 6, 2.2), plate);
  latch.position.set(0, 48, HZ + 2.2);
  door.add(latch);
  frame.add(door);

  // ---------- Wire Mesh Texture ----------
  const meshTex = (() => {
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.strokeStyle = '#277017'; g.lineWidth = 3;
    g.strokeRect(1.5, 1.5, 125, 125);
    g.beginPath();
    g.moveTo(64, 0); g.lineTo(64, 128);
    g.moveTo(0, 64); g.lineTo(128, 64);
    g.stroke();
    g.strokeStyle = '#5ec932'; g.lineWidth = 1;
    g.strokeRect(2.5, 2.5, 123, 123);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  })();

  function meshPanel(w, h, x, y, z, rotY) {
    const tex = meshTex.clone(); tex.needsUpdate = true;
    tex.repeat.set(w / 3.5, h / 3.5);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({
      map: tex, transparent: true, alphaTest: 0.22, side: THREE.DoubleSide, depthWrite: false
    }));
    m.position.set(x, y, z);
    m.rotation.y = rotY || 0;
    return m;
  }

  // Mesh pada bagian bawah (Lower Bays: depan, belakang, samping)
  const hLower = Y1 - Y0 - 5, cyLower = (Y0 + Y1) / 2;
  frame.add(meshPanel(W - 4, hLower, 0, cyLower, HZ - 1.2, 0));
  frame.add(meshPanel(W - 4, hLower, 0, cyLower, -HZ + 1.2, 0));
  frame.add(meshPanel(D - 4, hLower, HX - 1.2, cyLower, 0, Math.PI / 2));
  frame.add(meshPanel(D - 4, hLower, -HX + 1.2, cyLower, 0, Math.PI / 2));

  // Mesh pada bagian atas (Upper Bays: belakang, samping)
  const hUpper = Y2 - Y1 - 5, cyUpper = (Y1 + Y2) / 2;
  frame.add(meshPanel(W - 4, hUpper, 0, cyUpper, -HZ + 1.2, 0));
  frame.add(meshPanel(D - 4, hUpper, HX - 1.2, cyUpper, 0, Math.PI / 2));
  frame.add(meshPanel(D - 4, hUpper, -HX + 1.2, cyUpper, 0, Math.PI / 2));

  // MESH BAGIAN DEPAN ATAS DENGAN LUBANG MASUK BOTOL 20x30 CM:
  // Panel Kiri Depan (antara X = -73.75 sampai -15)
  const leftMeshW = (HX - 1.25) - 15; // 58.75 cm
  frame.add(meshPanel(leftMeshW, hUpper, -(HX - 1.25 + 15) / 2, cyUpper, HZ - 1.2, 0));
  // Panel Kanan Depan (antara X = +15 sampai +73.75)
  const rightMeshW = (HX - 1.25) - 15; // 58.75 cm
  frame.add(meshPanel(rightMeshW, hUpper, (HX - 1.25 + 15) / 2, cyUpper, HZ - 1.2, 0));
  // Panel Bawah Lubang (antara X = -15 sampai +15, Y = 52.5 sampai 68.5)
  frame.add(meshPanel(29, 16, 0, 60.5, HZ - 1.2, 0));
  // BAGIAN ATAS LUBANG (X = -15 s.d. +15, Y = 70 s.d. 90) DIBIARKAN TERBUKA TANPA KAWAT!

  // ---------- Sign Boards (Papan Nama & Papan SOP) ----------
  function makeCanvasTex(w, h, drawFn) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    drawFn(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // 1. Papan Nama Bank Sampah (Upper Right Bay, sesuai foto real)
  const nameBoardTex = makeCanvasTex(1100, 460, (g, w, h) => {
    g.fillStyle = '#72cf2c'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#226912'; g.lineWidth = 16; g.strokeRect(8, 8, w - 16, h - 16);
    g.strokeStyle = '#91e84e'; g.lineWidth = 4; g.strokeRect(20, 20, w - 40, h - 40);
    g.fillStyle = '#111b10'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'bold 84px Arial, sans-serif';
    g.fillText('BANK SAMPAH', w / 2, 80);
    g.font = 'bold 74px Arial, sans-serif';
    g.fillText('BOTOL PLASTIK', w / 2, 168);
    g.fillText('DESA SADASARI', w / 2, 256);
    g.font = 'bold 46px Arial, sans-serif';
    g.fillText('KELOMPOK 4', w / 2, 342);
    g.font = 'bold 42px Arial, sans-serif';
    g.fillText('KKM UMC 2026', w / 2, 404);
  });
  const nameBoard = new THREE.Group();
  nameBoard.add(new THREE.Mesh(new THREE.BoxGeometry(54, 24, 0.7), new THREE.MeshStandardMaterial({ color: 0x6ecc2a, roughness: 0.5 })));
  const nameFace = new THREE.Mesh(new THREE.PlaneGeometry(54, 24), new THREE.MeshBasicMaterial({ map: nameBoardTex, side: THREE.DoubleSide }));
  nameFace.position.z = 0.42;
  nameBoard.add(nameFace);
  // Posisikan di sebelah kanan lubang (X = 43 cm)
  nameBoard.position.set(43, 72, HZ + 1.1);
  frame.add(nameBoard);

  // 2. Papan SOP Penanganan & Pengepresan (Upper Left Bay, sebelah kanan Alat Press & kiri Lubang)
  const sopTex = makeCanvasTex(720, 480, (g, w, h) => {
    g.fillStyle = '#fcfcfb'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#2a4d27'; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8);
    // Header
    g.fillStyle = '#1a2c19'; g.font = 'bold 28px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('SOP Penanganan & Pengepresan', w / 2, 34);
    g.font = 'bold 24px Arial, sans-serif'; g.fillStyle = '#2d7a18';
    g.fillText('Botol Plastik', w / 2, 66);
    g.strokeStyle = '#b8cab5'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(30, 88); g.lineTo(w - 30, 88); g.stroke();
    // 4 Steps Cards
    const steps = [
      { n: '1', title: 'Pelepasan Label', desc: 'Lepas label & buang ke tong sampah label' },
      { n: '2', title: 'Pelepasan Tutup', desc: 'Buka tutup botol sebelum dipress' },
      { n: '3', title: 'Pengepresan', desc: 'Taruh botol di alat press & tekan tuas' },
      { n: '4', title: 'Masuk ke Lubang', desc: 'Masukkan botol pipih lewat lubang 20x30 cm' }
    ];
    const cw = 318, ch = 160;
    steps.forEach((s, i) => {
      const x = 28 + (i % 2) * (cw + 28);
      const y = 106 + Math.floor(i / 2) * (ch + 18);
      g.fillStyle = '#eff5ed'; g.fillRect(x, y, cw, ch);
      g.strokeStyle = '#bdd0ba'; g.lineWidth = 1.5; g.strokeRect(x, y, cw, ch);
      // Badge
      g.fillStyle = '#3ea320'; g.beginPath(); g.arc(x + 26, y + 28, 17, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.font = 'bold 19px Arial'; g.textAlign = 'center';
      g.fillText(s.n, x + 26, y + 29);
      // Title
      g.fillStyle = '#192b18'; g.font = 'bold 19px Arial'; g.textAlign = 'left';
      g.fillText(s.title, x + 52, y + 29);
      // Icon Box
      g.fillStyle = '#fff'; g.fillRect(x + 12, y + 56, 64, 88);
      g.strokeStyle = '#a4bca0'; g.strokeRect(x + 12, y + 56, 64, 88);
      if (i === 0) {
        g.fillStyle = '#6ec1eb'; g.fillRect(x + 32, y + 70, 24, 56);
        g.fillStyle = '#f39c12'; g.fillRect(x + 30, y + 86, 28, 22);
      } else if (i === 1) {
        g.fillStyle = '#1971c2'; g.fillRect(x + 34, y + 64, 20, 10);
        g.fillStyle = '#6ec1eb'; g.fillRect(x + 32, y + 82, 24, 50);
      } else if (i === 2) {
        g.fillStyle = '#8f4d1e'; g.fillRect(x + 22, y + 64, 10, 72);
        g.fillRect(x + 22, y + 70, 46, 10);
        g.fillStyle = '#6ec1eb'; g.fillRect(x + 34, y + 104, 22, 28);
      } else {
        // Ikon memasukkan botol ke lubang
        g.fillStyle = '#3ea320'; g.strokeRect(x + 18, y + 66, 52, 38);
        g.fillStyle = '#fff'; g.fillRect(x + 20, y + 68, 48, 34);
        g.fillStyle = '#6ec1eb'; g.fillRect(x + 30, y + 84, 28, 52);
      }
      // Description text
      g.fillStyle = '#384d36'; g.font = '14px Arial'; g.textAlign = 'left';
      const words = s.desc.split(' ');
      let line = '', ly = y + 76;
      for (let w of words) {
        if ((line + w).length > 18) {
          g.fillText(line, x + 86, ly); line = w + ' '; ly += 19;
        } else { line += w + ' '; }
      }
      if (line) g.fillText(line, x + 86, ly);
    });
  });
  const sopBoard = new THREE.Group();
  sopBoard.add(new THREE.Mesh(new THREE.BoxGeometry(32, 24, 0.5), new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.7 })));
  const sopFace = new THREE.Mesh(new THREE.PlaneGeometry(32, 24), new THREE.MeshBasicMaterial({ map: sopTex, side: THREE.DoubleSide }));
  sopFace.position.z = 0.32;
  sopBoard.add(sopFace);
  // Posisikan antara alat press dan lubang masuk (X = -32 cm)
  sopBoard.position.set(-32, 72, HZ + 1.1);
  frame.add(sopBoard);

  // ---------- ALAT PRESS BOTOL PLASTIK (Tinggi 38 cm, untuk botol 600 ml) ----------
  // Dibuat persis berdasarkan foto real alat press botol plastik
  const pressGroup = new THREE.Group();
  (function buildPress() {
    const H_PRESS = 38.0; // Tinggi aktual 38 cm sesuai instruksi
    const W_PRESS = 12.6;
    const D_BASE = 2.2;
    const D_WALL = 7.6;
    const T_WALL = 2.2;

    // Palang tengah tuas penyambung link

    const midWorldZ = pivotZ + midYLocal * Math.sin(leverAngle);
    const ramConnY = ramY + ramH / 2 + 0.8;
    const ramConnZ = D_BASE + D_WALL / 2;

    const linkDy = midWorldY - ramConnY;

    const link = new THREE.Mesh(new THREE.BoxGeometry(2.2, linkLen, 1.8), wood);

  // ---------- TEMPAT SAMPAH DARI GALON BEKAS (KIRI & KANAN) ----------

        g.fillStyle = '#f5cba7';
        g.beginPath(); g.ellipse(75, 355, 28, 18, 0.4, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(215, 365, 28, 18, -0.4, 0, Math.PI * 2); g.fill();
        // Ilustrasi orang buang sampah daur ulang
        g.fillStyle = '#5bd838'; g.beginPath(); g.arc(430, 290, 26, 0, Math.PI * 2); g.fill();
        g.lineWidth = 14; g.strokeStyle = '#5bd838'; g.lineCap = 'round';

        g.fillStyle = '#e8df31'; g.fillRect(362, 385, 12, 16);

      } else {

        g.fillText('Sampah', w / 2, 95);
        g.fillText('Organik', w / 2, 175);

        g.beginPath(); g.moveTo(35, 215); g.lineTo(w - 35, 215); g.stroke();
        // Logo daur ulang panah hijau

        g.strokeStyle = '#5ad438'; g.lineWidth = 13; g.lineCap = 'round';
        for (let a = 0; a < 3; a++) {
          const sAngle = a * (2 * Math.PI / 3) + 0.3;
          const eAngle = sAngle + 1.2;
          g.beginPath(); g.arc(cx, cy, cr, sAngle, eAngle); g.stroke();
          const tx = cx + cr * Math.cos(eAngle), ty = cy + cr * Math.sin(eAngle);

          g.fillStyle = '#5ad438';
          g.beginPath();
          g.moveTo(tx + 18 * Math.cos(tAng), ty + 18 * Math.sin(tAng));
          g.lineTo(tx - 10 * Math.cos(tAng + 0.8), ty - 10 * Math.sin(tAng + 0.8));
          g.lineTo(tx - 10 * Math.cos(tAng - 0.8), ty - 10 * Math.sin(tAng - 0.8));

    const labelPlane = new THREE.Mesh(new THREE.PlaneGeometry(18.5, 23.5), new THREE.MeshBasicMaterial({ map: labelTex, side: THREE.DoubleSide }));
    labelPlane.position.set(0, H_BASE + H_MESH / 2 + 1, R + 0.35);

        strip.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

  // ---------- Botol Plastik Pipih / Di-Press di Dalam Bank Sampah ----------
  const bottles = new THREE.Group();
  (function buildBottles() {
    let s = 11;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const bGeo = new THREE.CylinderGeometry(2.9, 2.9, 17, 12);
    const cGeo = new THREE.CylinderGeometry(1.4, 1.4, 1.8, 10);

  })();

  // ---------- Dimensi / Ukuran ----------
  const dims = new THREE.Group();

  const lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(dimColor), depthTest: false });
  const thinMat = new THREE.LineBasicMaterial({ color: new THREE.Color(dimColor), transparent: true, opacity: 0.55, depthTest: false });

    l.renderOrder = 10; dims.add(l);

    g.fillStyle = '#fffaf5'; g.strokeStyle = dimColor; g.lineWidth = 5;

    g.fillText(text, 220, 52);
    const t = new THREE.CanvasTexture(c);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
    s.scale.set(w, w / 4.4, 1); s.position.set(...p); s.renderOrder = 11; dims.add(s);
  }
  function dimension(a, b, tickDir, text, labelPos, w) {
    line(a, b);
    [a, b].forEach(p => line([p[0] - tickDir[0], p[1] - tickDir[1], p[2] - tickDir[2]], [p[0] + tickDir[0], p[1] + tickDir[1], p[2] + tickDir[2]]));
    label(text, labelPos, w || 32);
  }

  // Panjang = 150 cm (depan bawah)
  dimension([-HX, 0, 48], [HX, 0, 48], [0, 0, 3], 'P = 150 cm', [0, 0, 58], 34);
  line([-HX, 0, HZ], [-HX, 0, 50], thinMat); line([HX, 0, HZ], [HX, 0, 50], thinMat);
  // Lebar = 50 cm (samping kanan bawah)
  dimension([HX + 34, 0, -HZ], [HX + 34, 0, HZ], [3, 0, 0], 'L = 50 cm', [HX + 48, 0, 0], 30);
  line([HX + 28, 0, -HZ], [HX + 36, 0, -HZ], thinMat); line([HX + 28, 0, HZ], [HX + 36, 0, HZ], thinMat);
  // Tinggi = 100 cm (samping kiri)
  dimension([-HX - 34, 0, HZ], [-HX - 34, H, HZ], [3, 0, 0], 'T = 100 cm', [-HX - 52, H / 2, HZ], 32);
  line([-HX - 28, 0, HZ], [-HX - 36, 0, HZ], thinMat); line([-HX - 28, H, HZ], [-HX - 36, H, HZ], thinMat);
  // Kaki = 10 cm
  dimension([HX + 8, 0, 40], [HX + 8, LEG, 40], [3, 0, 0], 'Kaki = 10 cm', [HX + 32, LEG / 2 + 1, 40], 36);
  line([HX, LEG, HZ], [HX + 10, LEG, 40], thinMat); line([HX, 0, HZ], [HX + 10, 0, 40], thinMat);
  // Lubang Masuk Botol = 20 x 30 cm (di depan tengah)
  dimension([-15, 93, HZ + 2.5], [15, 93, HZ + 2.5], [0, 2, 0], 'Lubang = 20x30 cm', [0, 97, HZ + 2.5], 36);
  // Alat Press = 38 cm (depan dekat alat press)
  dimension([-43, 52, 40], [-43, 90, 40], [2, 0, 0], 'Press = 38 cm', [-43, 71, 48], 34);
  // Tong Galon = 85 cm (dekat galon kiri)
  dimension([-HX - 32, 0, -18], [-HX - 32, 85, -18], [2, 0, 0], 'Galon = 85 cm', [-HX - 50, 42.5, -18], 34);

  // ---------- Camera & Orbit Controls ----------
  const cam = { theta: 0.65, phi: 1.15, radius: 380 };
  const goal = { theta: cam.theta, phi: cam.phi, radius: cam.radius };
  let animating = false;

  function place() {
    const sp = Math.sin(cam.phi);
    camera.position.set(
      target.x + cam.radius * sp * Math.sin(cam.theta),
      target.y + cam.radius * Math.cos(cam.phi),
      target.z + cam.radius * sp * Math.cos(cam.theta)
    );
    camera.lookAt(target);
  }

  function fitRadius() {
    const a = camera.aspect;
    return a >= 1.4 ? 370 : a >= 1 ? 430 : 640 / Math.min(a * 1.15, 1) * 0.8 + 80;
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', () => { resize(); if (!userMoved) { cam.radius = goal.radius = fitRadius(); } });
  let userMoved = false;
  resize(); cam.radius = goal.radius = fitRadius(); place();

  const views = {
    iso: [0.65, 1.15],
    front: [0, Math.PI / 2],
    side: [Math.PI / 2, Math.PI / 2],
    top: [0, 0.02]
  };

  const viewBtns = document.querySelectorAll('#views button');
  viewBtns.forEach(b => b.addEventListener('click', () => {
    const v = views[b.dataset.v];
    goal.theta = v[0]; goal.phi = v[1];
    goal.radius = fitRadius() * (b.dataset.v === 'top' ? 0.95 : 1);
    animating = true; userMoved = false;
    viewBtns.forEach(x => x.classList.toggle('on', x === b));
  }));

  // Toggle functionality: Ukuran, Atap, Alat Press, Tong Galon, Botol (Rak kayu dihapus sepenuhnya)
  document.querySelectorAll('#toggles button').forEach(b => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    const t = b.dataset.t;
    if (t === 'dims') dims.visible = on;
    if (t === 'roof') roofGroup.visible = on;
    if (t === 'press') pressGroup.visible = on;
    if (t === 'galon') galonGroup.visible = on;
    if (t === 'bottles') bottles.visible = on;
  }));

  const ptrs = new Map();
  let pinch = 0;
  function stopAnim() { animating = false; userMoved = true; viewBtns.forEach(x => x.classList.remove('on')); }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });

  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) {
      stopAnim();
      cam.theta -= (e.clientX - p.x) * 0.007;
      cam.phi = Math.min(1.58, Math.max(0.02, cam.phi - (e.clientY - p.y) * 0.007));
      goal.theta = cam.theta; goal.phi = cam.phi;
    }
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) { stopAnim(); cam.radius = goal.radius = Math.min(750, Math.max(100, cam.radius * pinch / d)); }
      pinch = d;
    }
  });

  const up = e => { ptrs.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    stopAnim();
    cam.radius = goal.radius = Math.min(750, Math.max(100, cam.radius * Math.exp(e.deltaY * 0.001)));
  }, { passive: false });

  function loop() {
    if (animating) {
      let dt = goal.theta - cam.theta; dt = Math.atan2(Math.sin(dt), Math.cos(dt));
      cam.theta += dt * 0.12;
      cam.phi += (goal.phi - cam.phi) * 0.12;
      cam.radius += (goal.radius - cam.radius) * 0.12;
      if (Math.abs(dt) < 0.002 && Math.abs(goal.phi - cam.phi) < 0.002 && Math.abs(goal.radius - cam.radius) < 0.5) {
        animating = false; cam.theta = goal.theta; cam.phi = goal.phi; cam.radius = goal.radius;
      }
    }
    place();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
